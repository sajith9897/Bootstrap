<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Student marklist</title>
</head>
<body>
    <div class="container my-3">
        <div class="col-12">
            <h1 class="display-3 text-center">Student Profile</h1> 
            <blockquote class="blockquote text-center">“Learning never exhausts the mind.”</blockquote> 
            <img class="rounded-circle mx-auto d-block img-fluid" src="https://www.gghschool.com/wp-content/uploads/2025/03/AKY01926-scaled.jpg" alt="image" width="300px" height="200px">

            <table class="table table-striped table-bordered my-5 text-center">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">Subject</th>
                        <th>Mark Scored (Out of 100)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>English</td>
                        <td>92</td>
                    </tr>
                    <tr>
                        <td>Biology</td>
                        <td>65</td>
                    </tr>
                    <tr>
                        <td>Chemistry</td>
                        <td>74</td>
                    </tr>
                    <tr>
                        <td>Physics</td>
                        <td>85</td>
                    </tr>
                </tbody>
            </table>

            <div class="alert alert-success alert-dismissible fade show" >
                <button type="button" class="close" data-dismiss="alert">&times;</button>
                <strong>Success! </strong>Profile updated successfully.
            </div>

        </div>

    </div>
</body>
</html>
