<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Bakery Feedback</title>
</head>
<body>
    <div class="container my-4">
        <div class="text-center">
            <h1>Bakery Feedback</h1>
            <p class="text-muted">We would love to hear about your experience!</p>
        </div>
        

        <form>

            <div class="form-group">
               <label for="name">Customer Name:</label> 
               <input type="text" name="name" id="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
               <label for="email">Email Address:</label> 
               <input type="email" name="email" id="email" class="form-control" placeholder="Enter your Email Address" required>
            </div>

            <div class="form-group">
                <label for="comment">Feedback Message:</label>
                <textarea class="form-control" rows="3" id="comment" placeholder="Write your feedback here..."></textarea>
            </div>

            <div class="form-group">
               <label>Preferred Contact Method:</label>

                <div class="form-check">
                    <input type="radio" name="contact" id="emailcontact" class="form-check-input">
                    <label class="form-check-label" for="emailcontact">Email</label>
                </div>

                <div class="form-check">
                    <input type="radio" name="contact" id="phonecontact" class="form-check-input">
                    <label class="form-check-label" for="phonecontact">Phone</label>
               </div>
            </div>

            <div class="form-group">
                <label for="satisfaction">Satisfaction Level: 1-10</label>
                <input type="range" name="satisfaction" class="custom-range" id="satisfaction" min="1" max="10">
            </div>

            <div class="form-group">
                <label for="ordertype">Type of Order:</label>
                <select name="ordertype" id="ordertype" class="form-control" required>
                    <option>Choose an order type</option>
                    <option>Cake</option>
                    <option>Cookies</option>
                    <option>Pastries</option>
                </select>
            </div>

            <div>
                <button type="submit" class="btn btn-primary d-block mx-auto">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
