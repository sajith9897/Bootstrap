<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Signup Form</title>

</head>
<body class="bg-primary">
    <div class="container">
                <div class="card mt-5 mb-2">
                    <div class="card-body">
                        <h1 class="font-weight-bold">Sign Up</h1>
                        <p class="text-muted">Please fill in this form to create an account!</p>
                        <hr>

                        <form>
                            <div class="row">
                                <div class="form-group  col-md-6">
                                    <input type="text" class="form-control border-0 bg-light" placeholder="First Name" name="fname">
                                </div>
                                <div class="form-group col-md-6">
                                    <input type="text" class="form-control border-0 bg-light" placeholder="Last Name" name="lname">
                                </div>
                            </div>

                            <div class="form-group ">
                                <input type="email" class="form-control border-0 bg-light" id="email" placeholder="Email" name="email">
                            </div>

                            <div class="form-group">
                                <input type="password" class="form-control border-0 bg-light" id="pwd" placeholder="Password" name="pswd">
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control border-0 bg-light" id="confrmpwd" placeholder="Confirm Password" name="confrmpswd">
                            </div>

                            <div class="form-group form-check">
                                
                                <input class="form-check-input" type="checkbox" name="remember">
                                <label class="form-check-label text-muted">I accept the <a href="#">Terms of use</a> & <a href="#">Privacy Policy</a></label>
                            </div>

                            <button type = "button" class = "btn btn-primary pr-5 pl-5 font-weight-bold">Sign Up</button>
                        </form>
                        
                    </div>
                    
                </div>
        <p class="text-white text-center">Already have an account? <a class="text-white" href="#"> <u>Login here</u></a>.</p>
         
    </div>
</body>
</html>
