<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Student Dashboard</title>
</head>
<body>
    <div class="container my-2">
        <h1 class="display-4 text-center">Student Dashboard</h1>
        <ul class = "breadcrumb">
            <li class = "breadcrumb-item"><a href = "#">Home</a></li>
            <li class = "breadcrumb-item"><a href="#">Dashboard</a></li>
            <li class = "breadcrumb-item active" aria-current = "page">My course</li>
        </ul>

        <div class="text-center mt-5">
            <button type = "button" class = "btn btn-outline-success">Start new course</button>
        </div>
        <div class="mt-5">
            <h2> My Progress <span class = "badge badge-pill badge-info badge">3 Courses</span> </h2>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70% Completed</div>
            </div>

            <div class="mt-5">
                <ul class="pagination justify-content-center">
                    <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item active"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
            </div>
        </div>
        
    </div>
    
</body>
</html>
