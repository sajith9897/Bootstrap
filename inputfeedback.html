<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Feedback Form</title>
</head>
<body>
    <div class="container">
        <form action="">
            <h1 class="text-center">Form</h1>
            <div class="row mt-4">
                <div class="col-sm">
                    <label for="usrnme">Username:</label>
                    <input type="text" name="usrnme" id="usrnme" class = "form-control" placeholder="Enter Username">
                </div>
                <div class="col-sm">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" class = "form-control" placeholder="Enter Email">
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm">
                    <label for="name">Full Name:</label>
                    <input type="text" name="name" id="name" class = "form-control" placeholder="Enter your Full Name">
                </div>
                <div class="col-sm">
                    <label for="file">Upload your profile photo:</label>
                    <input type="file" class="form-control" name="file">
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm">
                    <label for="pwd">Password:</label>
                    <input type = "password" class = "form-control" id = "pwd" placeholder = "Enter password" name = "pwd">
                </div>

                <div class="col-sm">
                     <label for="conpwd">Confirm Password:</label>
                    <input type = "password" class = "form-control" id = "conpwd" placeholder = "Confirm password" name = "conpwd">
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm">
                    <button type = "submit" class = "btn btn-primary btn-block d-block mx-auto" >Submit</button>
                </div>
            </div>
        </form>
    </div>
    
    
</body>
</html>
